services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.redis.endpoints=redis:6379"
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - redis

  api:
    build: .
    ports:
      - "8090:8090"
    environment:
      - REDIS_ADDR=redis:6379
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  redis_data:
